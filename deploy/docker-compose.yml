# ==============================================================================
# 🌿 NaN-EcoNet: Monorepo Microservices & Infrastructure Orchestration
# ==============================================================================
# BẢNG TRA CỨU CỔNG DỊCH VỤ & ÁNH XẠ MÔI TRƯỜNG (PORT MAPPING & ENVIRONMENT GUIDE)
#
# +-------+----------------------------------+-----------------------+-------------------------+--------------------+
# | Cổng  | Dịch Vụ                          | Biến Môi Trường       | Môi Trường Dev (Local)  | Docker Compose     |
# +-------+----------------------------------+-----------------------+-------------------------+--------------------+
# | 8502  | MapLibre Dual-Map Dispatcher     | COLLECTION_DISPATCHER | http://localhost:8502   | 8502:8502 (Host:Ctr)|
# | 8501  | Streamlit Convergence Dashboard  | COLLECTION_DASHBOARD  | http://localhost:8501   | 8501:8501          |
# | 8000  | FastAPI VRP Solver Core          | COLLECTION_ENGINE_PORT| http://localhost:8000   | 8000:8000          |
# | 3006  | Citizen Bulky Waste Portal       | CITIZEN_PORTAL_PORT   | http://localhost:3006   | 3006:80 (Nginx)    |
# | 3011  | Enterprise BI Copilot & MCP      | ENTERPRISE_BI_PORT    | http://localhost:3011   | 3011:3011          |
# | 3010  | EcoPass Voucher Client Scanner   | ECOPASS_SCANNER_PORT  | http://localhost:3010   | 3010:3000 (Next.js)|
# | 5002  | AI Visual Synthesis Gateway      | AI_GATEWAY_PORT       | http://localhost:5002   | 5002:5002 (FastAPI)|
# | 5003  | OSRM Local Routing Engine        | OSRM_PORT             | http://localhost:5003   | 5003:5000          |
# | 6379  | Redis Message Queue              | REDIS_PORT            | localhost:6379          | 6379:6379          |
# | 5001  | EcoPass Voucher Backend & API    | ECOPASS_API_PORT      | http://localhost:5001   | 5001:8000          |
# | 8082  | Citizen IoT Telemetry / Traccar  | CITIZEN_API_PORT      | http://localhost:8082   | 8082:8082          |
# +-------+----------------------------------+-----------------------+-------------------------+--------------------+
#
# HƯỚNG DẪN ÁNH XẠ CỔNG CHO DEVELOPMENT VÀ PRODUCTION:
#
# 1. Môi trường Phát triển (Development):
#    - Từng phân hệ có thể chạy trực tiếp bằng Makefile (make dev-engine, make dev-citizen, make dev-ecopass).
#    - Khi chạy qua Docker Compose, các port trên host ánh xạ trực tiếp 1:1 hoặc qua cổng chuẩn hóa.
#    - Có thể ghi đè cổng bằng tệp `.env` đặt tại thư mục gốc hoặc chỉ định biến môi trường dòng lệnh:
#      Ví dụ: `COLLECTION_ENGINE_PORT=8001 docker compose up -d`
#
# 2. Môi trường Vận hành (Production):
#    - Toàn bộ microservices giao tiếp nội bộ thông qua mạng bridge `nan-econet-network` bằng container name
#      (ví dụ: `http://collection-engine:8000`, `http://osrm-backend:5000`, `redis://redis-queue:6379`).
#    - Các cổng dịch vụ công cộng (3006, 3010, 8502) có thể được định tuyến qua Reverse Proxy (Nginx/Traefik)
#      với chứng chỉ SSL/TLS tự động và tường lửa chặn truy cập trực tiếp vào các cổng nội bộ (6379, 8000).
# ==============================================================================

services:
  # ============================================================================
  # 1. ECOPASS ENTERPRISE SUITE
  # ============================================================================

  # [Port 3010] EcoPass Voucher Client Scanner (Next.js / QR Scanner) - Production-Ready
  ecopass-web:
    container_name: nan-ecopass-web
    build:
      context: ../apps/ecopass-enterprise/ecopass/client-scanner
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ECOPASS_SCANNER_PORT:-${ECOPASS_PORT:-3010}}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${ECOPASS_API_URL:-http://localhost:5001/api}
      - NEXT_PUBLIC_STAGING=false
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3011}
    networks:
      - nan-econet-network
    depends_on:
      - ecopass-api

  # [Port 5001] EcoPass Voucher Backend & API (Django / SQLite) - Production-Ready
  ecopass-api:
    container_name: nan-ecopass-api
    build:
      context: ../apps/ecopass-enterprise/ecopass/voucher-backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${ECOPASS_API_PORT:-5001}:8000"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SECURE_COOKIES=${SECURE_COOKIES:-False}
      - REDIS_URL=${REDIS_URL:-redis://redis-queue:6379/1}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////opt/app/database/db.sqlite3}
      - FACEBOOK_API_KEY=${FACEBOOK_API_KEY:-}
      - ZALO_OA_SECRET=${ZALO_OA_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3011}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ecopass_data:/opt/app/database
    networks:
      - nan-econet-network
    depends_on:
      - redis-queue

  # [Port 3011] Enterprise BI Copilot & MCP Server (Node.js / TypeScript) - Beta / Enterprise
  enterprise-bi-copilot:
    container_name: nan-bi-copilot
    build:
      context: ../apps/ecopass-enterprise/enterprise-bi-copilot
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ENTERPRISE_BI_PORT:-3011}:3011"
    environment:
      - PORT=3011
      - NODE_ENV=production
      - REDIS_URL=${REDIS_URL:-redis://redis-queue:6379/4}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - bi_copilot_data:/app/data
    networks:
      - nan-econet-network
    depends_on:
      - redis-queue

  # [Port 5002] AI Visual Synthesis Gateway (FastAPI / FLUX / Gemini) - Prototype
  ai-visual-gateway:
    container_name: nan-ai-visual-gateway
    build:
      context: ../apps/ecopass-enterprise/agy-image-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AI_GATEWAY_PORT:-5002}:5002"
    environment:
      - PORT=5002
      - PROXY_PORT=8899
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ai_gateway_storage:/app/storage
    networks:
      - nan-econet-network

  # ============================================================================
  # 2. SMART COLLECTION & 3D-PACO OPTIMIZATION ENGINE
  # ============================================================================

  # [Port 8000] FastAPI VRP Solver Core (C++ OpenMP / OR-Tools) - Production-Ready
  collection-engine:
    container_name: nan-collection-engine
    build:
      context: ../apps/smart-collection-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend
    ports:
      - "${COLLECTION_ENGINE_PORT:-8000}:8000"
    environment:
      - OSRM_HOST=${OSRM_HOST:-http://osrm-backend:5000}
      - REDIS_URL=${REDIS_URL:-redis://redis-queue:6379/2}
      - NUM_FLEET_VEHICLES=${NUM_FLEET_VEHICLES:-8}
      - MAX_CAPACITY_KG=${MAX_CAPACITY_KG:-5000}
      - SOLVER_DEFAULT_ALGORITHM=${SOLVER_DEFAULT_ALGORITHM:-paco}
    volumes:
      - collection_data:/app/src/data
    networks:
      - nan-econet-network
    depends_on:
      - redis-queue
      - osrm-backend

  # [Port 8501] Streamlit Parameter Convergence Dashboard (Python 3.11) - Pilot / Research
  collection-dashboard:
    container_name: nan-collection-dashboard
    build:
      context: ../apps/smart-collection-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    working_dir: /app/streamlit
    ports:
      - "${COLLECTION_DASHBOARD_PORT:-8501}:8501"
    environment:
      - SOLVER_API_URL=http://collection-engine:8000
      - OSRM_HOST=${OSRM_HOST:-http://osrm-backend:5000}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ../apps/smart-collection-engine/streamlit:/app/streamlit
      - ../apps/smart-collection-engine/map_ui:/app/map_ui
    networks:
      - nan-econet-network
    depends_on:
      - collection-engine

  # [Port 8502] MapLibre Dual-Map Interactive Dispatcher - Production-Ready
  collection-dispatcher:
    container_name: nan-collection-dispatcher
    build:
      context: ../apps/smart-collection-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python3", "-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8502"]
    working_dir: /app/map_ui
    ports:
      - "${COLLECTION_DISPATCHER_PORT:-8502}:8502"
    environment:
      - SOLVER_API_URL=http://collection-engine:8000
      - OSRM_HOST=${OSRM_HOST:-http://osrm-backend:5000}
    volumes:
      - ../apps/smart-collection-engine/map_ui:/app/map_ui
    networks:
      - nan-econet-network
    depends_on:
      - collection-engine

  # ============================================================================
  # 3. CITIZEN BULKY APP & IOT DISPATCHER
  # ============================================================================

  # [Port 3006] Citizen Bulky Waste Portal (React 18 / Vite / Nginx) - Production-Ready
  citizen-portal:
    container_name: nan-citizen-portal
    build:
      context: ../apps/citizen-bulky-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CITIZEN_PORTAL_PORT:-3006}:80"
    environment:
      - VITE_APP_VERSION=1.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PRICING_BASE_RATE=${PRICING_BASE_RATE:-250000}
      - DISPATCHER_SECRET=${DISPATCHER_SECRET:-secret-key-nan-econet}
    networks:
      - nan-econet-network
    depends_on:
      - citizen-api

  # [Port 8082] Citizen IoT Telemetry & Tracking Gateway (Traccar Alpine)
  citizen-api:
    container_name: nan-citizen-api
    image: traccar/traccar:alpine
    restart: unless-stopped
    ports:
      - "${CITIZEN_API_PORT:-8082}:8082"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis-queue:6379/3}
      - DISPATCHER_SECRET=${DISPATCHER_SECRET:-secret-key-nan-econet}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - citizen_traccar_data:/opt/traccar/data
      - citizen_traccar_logs:/opt/traccar/logs
    networks:
      - nan-econet-network

  # ============================================================================
  # 4. SHARED INFRASTRUCTURE (REDIS QUEUE & OSRM ROUTE ENGINE)
  # ============================================================================

  # [Port 6379] Redis Message Queue & PubSub Broker
  redis-queue:
    container_name: nan-redis-queue
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nan-econet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # [Port 5003 / 5000] OSRM Local Routing Engine
  osrm-backend:
    container_name: nan-osrm-backend
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /data/map.osrm ]; then
          echo "Starting OSRM routing engine with /data/map.osrm..."
          exec osrm-routed --algorithm mld /data/map.osrm
        else
          echo "⚠️ /data/map.osrm not found. Place your extracted .osrm map file in osrm_data volume to enable routing."
          echo "Keeping container active for configuration..."
          exec tail -f /dev/null
        fi
    ports:
      - "${OSRM_PORT:-5003}:5000"
    volumes:
      - osrm_data:/data
    networks:
      - nan-econet-network

# ==============================================================================
# NETWORKS & VOLUMES SPECIFICATION
# ==============================================================================
networks:
  nan-econet-network:
    driver: bridge
    name: nan-econet-network

volumes:
  redis_data:
    name: nan_econet_redis_data
  ecopass_data:
    name: nan_econet_ecopass_data
  collection_data:
    name: nan_econet_collection_data
  citizen_traccar_data:
    name: nan_econet_citizen_traccar_data
  citizen_traccar_logs:
    name: nan_econet_citizen_traccar_logs
  osrm_data:
    name: nan_econet_osrm_data
  bi_copilot_data:
    name: nan_econet_bi_copilot_data
  ai_gateway_storage:
    name: nan_econet_ai_gateway_storage
