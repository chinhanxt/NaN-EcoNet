[project]
name = "vrp-viz"
version = "0.1.0"
description = "VRP-PL Visualization App"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "matplotlib>=3.10.7",
    "pyyaml>=6.0.3",
    "streamlit>=1.51.0",
    "streamlit-folium>=0.27.4",
]

[tool.setuptools]
py-modules = ["app", "map_visualizer", "solver_api_client", "vrp_parser"]
